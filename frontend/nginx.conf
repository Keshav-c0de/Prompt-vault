server {
    listen 80;
    server_name prompt-vault.dev www.prompt-vault.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name prompt-vault.dev www.prompt-vault.dev;

    ssl_certificate /etc/letsencrypt/live/prompt-vault.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompt-vault.dev/privkey.pem;

    # Standard SSL Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}